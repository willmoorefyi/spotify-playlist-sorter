[project]
name = "spotify-playlist-sorter"
version = "0.1.0"
description = "CLI tool to sort Spotify playlists by artist."
authors = [
    {name = "Will Moore",email = "wlmmoor@amazon.com"}
]
readme = "README.md"
license = {text = "0BSD"}
requires-python = ">=3.12"
dependencies = [
    "spotipy (>=2.26.0,<3.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0"
]

[tool.poetry]
packages = [{include = "spotify_playlist_sorter", from = "src"}]

[tool.poetry.scripts]
sort-playlist = "spotify_playlist_sorter.cli:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
